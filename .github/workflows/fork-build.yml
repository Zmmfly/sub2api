name: Build traffic-stat latest
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: read
  packages: write
jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: fork-traffic-stat-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Image metadata
        id: meta
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "version=traffic-stat-${SOURCE_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.source_sha }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ inputs.source_sha }}
            DATE=${{ steps.meta.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=traffic-stat
          cache-to: type=gha,mode=max,scope=traffic-stat
      - name: Promote only current branch tip to latest
        id: promote
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/dev/traffic-stat | cut -f1)
          if [[ "$tip" != "$SOURCE_SHA" ]]; then
            echo "Branch advanced to $tip; SHA image published, latest promotion skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
          echo 'Promoted the current traffic-stat source to `latest`.' >> "$GITHUB_STEP_SUMMARY"
      - name: Record published digest
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: printf 'Published `%s:sha-%s`\n\nSource `%s`\n\nDigest `%s`\n' "$IMAGE" "$SOURCE_SHA" "$SOURCE_SHA" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
