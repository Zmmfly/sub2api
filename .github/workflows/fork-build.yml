name: Publish fork main release
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
permissions:
  contents: write
  packages: write
# The lock covers allocation through publication, across both callers. Never cancel
# a running publisher; a retry reuses its immutable SHA-to-tag reservation.
concurrency:
  group: fork-main-release
  cancel-in-progress: false
jobs:
  # Both entry points validate their exact source here. A GITHUB_TOKEN push
  # from the sync workflow does not trigger standalone push workflows.
  ci:
    uses: ./.github/workflows/backend-ci.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ inputs.source_sha }}
  security:
    uses: ./.github/workflows/security-scan.yml
    permissions:
      contents: read
    with:
      source_sha: ${{ inputs.source_sha }}
  release:
    needs: [ci, security]
    if: github.repository == 'Zmmfly/sub2api'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Reserve immutable fork version
        id: version
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch origin main --tags
          if [[ "$SOURCE_SHA" != "$(git rev-parse origin/main)" ]]; then
            echo 'Source is no longer main tip; superseded run skipped before version allocation.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'active=true' >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/scripts/fork-release.py allocate --sha "$SOURCE_SHA" --push
      - name: Check completed release (idempotent retry)
        if: steps.version.outputs.active == 'true'
        id: status
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python .github/scripts/fork-release.py status --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --output release-input
      - uses: pnpm/action-setup@v6
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        with:
          version: 9
      - uses: actions/setup-node@v6
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Build embedded frontend
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile && pnpm run build
      - uses: actions/setup-go@v6
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install release validation tooling
        if: steps.version.outputs.active == 'true'
        run: python -m pip install -r .github/release-tools/requirements-release.txt
      - name: Prepare exact fork build version
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$RELEASE_VERSION" > backend/cmd/server/VERSION
          python .github/release-tools/release_matrix.py config fork-build --output "$RUNNER_TEMP/goreleaser.fork.yaml"
      - name: Build all updater archives (no publication)
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean --parallelism=1 --skip=validate,publish,docker,announce --config=${{ runner.temp }}/goreleaser.fork.yaml
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DATE: ${{ steps.version.outputs.date }}
          # Build-only snapshot: do not ask GoReleaser's SemVer parser to treat
          # z<base>-N as an upstream SemVer/prerelease. Snapshot supplies Version.
          GORELEASER_CURRENT_TAG: v0.0.0
      - name: Collect freshly built archives
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: |
          python .github/release-tools/release_matrix.py collect-all --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --output release-input
      - name: Verify archives and prepare image contexts (including completed retries)
        if: steps.version.outputs.active == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python .github/release-tools/release_matrix.py contexts --version "$RELEASE_VERSION" --sha "$RELEASE_SHA" --input release-input --output .release-context
      - uses: docker/setup-qemu-action@v3
        if: steps.version.outputs.active == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.active == 'true'
      - uses: docker/login-action@v3
        if: steps.version.outputs.active == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable versioned image
        if: steps.version.outputs.active == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/fork-images.sh build
      - name: Publish complete stable release
        if: steps.version.outputs.active == 'true' && steps.status.outputs.published != 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: python .github/scripts/fork-release.py publish --tag "$RELEASE_TAG" --sha "$RELEASE_SHA" --input release-input
      - name: Promote current main only
        if: steps.version.outputs.active == 'true'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_SHA: ${{ inputs.source_sha }}
        run: bash .github/scripts/fork-images.sh promote
