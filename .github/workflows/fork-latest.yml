name: Fork main push and manual release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  resolve:
    if: github.repository == 'Zmmfly/sub2api'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  release:
    needs: resolve
    uses: ./.github/workflows/fork-build.yml
    with:
      source_sha: ${{ needs.resolve.outputs.sha }}
