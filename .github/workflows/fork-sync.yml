name: Sync upstream into fork main
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'Zmmfly/sub2api'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.sync.outputs.sha }}
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Merge upstream into fork main
        id: sync
        shell: bash
        run: bash .github/scripts/fork-sync.sh
  build:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/fork-build.yml
    with:
      source_sha: ${{ needs.sync.outputs.sha }}
